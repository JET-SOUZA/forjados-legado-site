<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Galeria — Igreja Semeando Amor</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg">

  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="Logo" class="logo">
      <h1>Galeria de Fotos — Igreja Semeando Amor</h1>
    </div>
  </header>

  <main class="container">
    <section class="gallery-card">
      <div id="gallery" class="grid">Carregando galeria…</div>
    </section>
  </main>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="closeLb" class="lb-close">✕</button>
    <img id="lb-img" src="" alt="Preview">
    <a id="lb-download" class="lb-download" download>Baixar</a>
  </div>

<script>
// Carrega o fotos.json (na mesma pasta do HTML)
fetch('./fotos.json')
  .then(res => res.json())
  .then(data => {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    data.forEach(item => {
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';

      const img = document.createElement('img');
      img.src = item.thumb || item.src;
      img.dataset.full = item.src;
      img.alt = item.alt || '';

      img.loading = 'lazy';

      wrap.appendChild(img);
      gallery.appendChild(wrap);
    });

    // Lightbox
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbDownload = document.getElementById('lb-download');

    gallery.addEventListener('click', e => {
      if (e.target.tagName === 'IMG') {
        const full = e.target.dataset.full;
        lbImg.src = full;
        lbDownload.href = full;
        lb.style.display = 'flex';
        lb.setAttribute('aria-hidden','false');
      }
    });

    document.getElementById('closeLb').onclick = () => {
      lb.style.display = 'none';
      lb.setAttribute('aria-hidden','true');
    };
  })
  .catch(err => {
    console.error(err);
    document.getElementById('gallery').innerText = 'Erro ao carregar fotos.';
  });
</script>

</body>
</html>
