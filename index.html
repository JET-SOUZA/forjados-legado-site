<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Galeria de Fotos — Igreja Semeando Amor</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
</head>
<body class="bg">
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="Logo" class="logo">
      <h1>Galeria de Fotos — Igreja Semeando Amor</h1>
    </div>
    <p class="subtitle">Encontre suas fotos enviando uma selfie • Tema: laranja &amp; preto</p>
  </header>

  <main class="container">
    <section class="search-card">
      <h2>Buscar por selfie</h2>
      <input id="selfie" type="file" accept="image/*" />
      <div id="status">Aguardando selfie...</div>
      <div class="help">Dica: use uma selfie onde o rosto esteja bem visível.</div>
    </section>

    <section class="results">
      <h3>Resultados</h3>
      <div id="gallery" class="grid">Carregando galeria…</div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="closeLb" class="lb-close">✕</button>
    <img id="lb-img" src="" alt="Preview">
    <a id="lb-download" class="lb-download" download>Baixar</a>
  </div>

<script src="script.js" defer></script>
</body>
</html>
